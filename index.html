<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple dashboard for starting focus timer sessions."
    />
    <title>Focus Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <p class="eyebrow">Focus Timer</p>
      <h1>Make room for meaningful work.</h1>
      <p class="intro">Start a distraction-free session from your dashboard.</p>
      <button class="primary-button" type="button" id="open-timer">
        Start focus session
      </button>
    </main>

    <dialog id="timer-modal" aria-labelledby="timer-title">
      <form method="dialog" class="modal-card">
        <button class="close-button" type="submit" aria-label="Close timer">
          &times;
        </button>
        <p class="eyebrow">New session</p>
        <h2 id="timer-title">Choose your focus time</h2>
        <div class="durations" role="group" aria-label="Focus duration">
          <button type="button" data-minutes="15">15 min</button>
          <button type="button" data-minutes="25" class="selected">25 min</button>
          <button type="button" data-minutes="45">45 min</button>
        </div>
        <p class="timer-readout" id="timer-readout">25:00</p>
        <button class="primary-button" id="start-timer" type="button">
          Begin focus session
        </button>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
